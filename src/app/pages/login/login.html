<p-toast />

<div class="login-wrapper">
  <div class="login-card">

    <div class="login-logo" (click)="onLogoClick()">
      <div class="logo-circle">
        <i class="pi pi-shield"></i>
      </div>
    </div>

    <div class="login-header">
      <h1 class="login-title">ERP Seguridad</h1>
      <p class="login-subtitle">Inicia sesión para continuar</p>
    </div>

    <div class="login-form">
      <div class="field">
        <label class="field-label">Correo electrónico</label>
        <input
          pInputText
          [(ngModel)]="email"
          type="email"
          placeholder="correo@ejemplo.com"
          class="w-full"
          (keyup.enter)="onLogin()"
        />
      </div>

      <div class="field">
        <label class="field-label">Contraseña</label>
        <p-password
          [(ngModel)]="password"
          [feedback]="false"
          [toggleMask]="true"
          placeholder="••••••••"
          styleClass="w-full"
          inputStyleClass="w-full"
          (keyup.enter)="onLogin()"
        />
      </div>

      <p-button
        label="Iniciar sesión"
        icon="pi pi-sign-in"
        [loading]="loading"
        [raised]="true"
        styleClass="w-full login-btn"
        (onClick)="onLogin()"
      />

      <div class="login-divider">o</div>

      <div class="login-register">
        <span>¿No tienes cuenta?</span>
        <a routerLink="/register">Regístrate aquí</a>
      </div>
    </div>

  </div>
</div>
