<aside class="sidebar" [class.collapsed]="isCollapsed">
  <div class="sidebar-header">
    <div class="brand">
      <i class="pi pi-bolt brand-icon"></i>
      @if (!isCollapsed) {
        <span class="brand-name">ERP Seguridad</span>
      }
    </div>
    <button class="toggle-btn" (click)="toggleCollapse()" pRipple>
      <i class="pi" [class.pi-chevron-left]="!isCollapsed" [class.pi-chevron-right]="isCollapsed"></i>
    </button>
  </div>

  <nav class="sidebar-nav">

    <a class="nav-item" routerLink="/home" routerLinkActive="active" pRipple>
      <i class="pi pi-home nav-icon"></i>
      @if (!isCollapsed) {
        <span class="nav-label">Inicio</span>
      }
    </a>

    <a *ifHasPermission="'user:view'"
      class="nav-item"
      routerLink="/users"
      routerLinkActive="active"
      pRipple
    >
      <i class="pi pi-user nav-icon"></i>
      @if (!isCollapsed) {
        <span class="nav-label">Mi perfil</span>
      }
    </a>

    <a *ifHasPermission="'group:view'"
      class="nav-item"
      routerLink="/groups"
      routerLinkActive="active"
      pRipple
    >
      <i class="pi pi-th-large nav-icon"></i>
      @if (!isCollapsed) {
        <span class="nav-label">Grupos</span>
      }
    </a>

    <a *ifHasPermission="'group:manage'"
      class="nav-item"
      routerLink="/admin-groups"
      routerLinkActive="active"
      pRipple
    >
      <i class="pi pi-cog nav-icon"></i>
      @if (!isCollapsed) {
        <span class="nav-label">Admin Grupos</span>
      }
    </a>

    <a *ifHasPermission="'user:manage'"
      class="nav-item"
      routerLink="/admin-users"
      routerLinkActive="active"
      pRipple
    >
      <i class="pi pi-user-edit nav-icon"></i>
      @if (!isCollapsed) {
        <span class="nav-label">Admin Usuarios</span>
      }
    </a>

  </nav>

  <div class="sidebar-footer">
    <button class="logout-btn" (click)="onLogout()" pRipple>
      <i class="pi pi-sign-out"></i>
      @if (!isCollapsed) {
        <span>Salir</span>
      }
    </button>

    @if (!isCollapsed) {
      <span class="version-label">V3.5</span>
    }
  </div>
</aside>
